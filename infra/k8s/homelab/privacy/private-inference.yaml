# Apply after pinned public model artifacts have been downloaded and verified.
# Inference receives no document-capable outbound network access.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: papervault-private-inference
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [papervault-model, papervault-embeddings, papervault-reranker, papervault-parser]
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: papervault
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [api, worker, enrichment, index, understanding]
      ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 11434}
        - {protocol: TCP, port: 5001}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
