apiVersion: v1
kind: Service
metadata:
  name: papervault-redis
spec:
  selector:
    app.kubernetes.io/name: papervault-redis
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: papervault-redis
spec:
  serviceName: papervault-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: papervault-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: papervault-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4-alpine
          command:
            - /bin/sh
            - -ec
            - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$REDIS_PASSWORD"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: papervault-runtime
                  key: REDIS_PASSWORD
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: papervault-runtime
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            initialDelaySeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: longhorn
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
