apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: papervault-database
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
  storage:
    size: 5Gi
    storageClass: longhorn
  bootstrap:
    initdb:
      database: papervault
      owner: papervault
      secret:
        name: papervault-database-user
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
