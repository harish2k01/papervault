apiVersion: v1
kind: Service
metadata:
  name: papervault-model
spec:
  selector:
    app.kubernetes.io/name: papervault-model
  ports:
    - name: http
      port: 11434
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: papervault-model
spec:
  serviceName: papervault-model
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: papervault-model
  template:
    metadata:
      labels:
        app.kubernetes.io/name: papervault-model
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ollama
          # Ollama v0.40.5; immutable multi-platform manifest.
          image: ollama/ollama@sha256:5d3a2f25f9825628daba94dc0b1d421c7d57d6c03ae5faa9ba050e058bab8241
          args: [serve]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: HOME
              value: /data
            - name: OLLAMA_MODELS
              value: /data/models
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            - name: OLLAMA_NO_CLOUD
              value: "1"
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            - name: OLLAMA_MAX_QUEUE
              value: "4"
            - name: OLLAMA_CONTEXT_LENGTH
              value: "16384"
            - name: OLLAMA_KEEP_ALIVE
              value: 30m
          ports:
            - name: http
              containerPort: 11434
          startupProbe:
            httpGet:
              path: /api/version
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/tags
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/version
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 1500m
              memory: 4Gi
            limits:
              cpu: "3"
              memory: 6Gi
          volumeMounts:
            - name: models
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: models
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            storage: 15Gi
