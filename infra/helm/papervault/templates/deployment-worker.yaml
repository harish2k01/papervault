apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "papervault.fullname" . }}-worker
  labels:
    {{- include "papervault.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.replicaCount.worker }}
  selector:
    matchLabels:
      {{- include "papervault.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "papervault.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "papervault.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext.worker | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "papervault.image" .Values.image.worker | quote }}
          imagePullPolicy: {{ .Values.image.worker.pullPolicy }}
          command:
            - celery
            - -A
            - papervault_api.worker.celery_app:celery_app
            - worker
            - --loglevel=INFO
            - {{ printf "--concurrency=%v" (.Values.worker.concurrency | default 2) | quote }}
            - --prefetch-multiplier=1
          securityContext:
            {{- toYaml .Values.containerSecurityContext.worker | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "papervault.configMapName" . }}
            - secretRef:
                name: {{ include "papervault.secretName" . }}
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import socket
                  from papervault_api.worker.celery_app import celery_app
                  replies = celery_app.control.ping(destination=["celery@" + socket.gethostname()], timeout=3)
                  assert replies, "Worker did not answer through its configured broker"
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 15
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
