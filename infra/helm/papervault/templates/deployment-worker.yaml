{{- $root := . -}}
{{- range $role := list "worker" "enrichment" }}
{{- if or (eq $role "worker") $root.Values.worker.separateEnrichment }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "papervault.fullname" $root }}-{{ $role }}
  labels:
    {{- include "papervault.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
spec:
  replicas: {{ index $root.Values.replicaCount $role | default 1 }}
  selector:
    matchLabels:
      {{- include "papervault.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: {{ $role }}
  template:
    metadata:
      labels:
        {{- include "papervault.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $role }}
      {{- with $root.Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "papervault.serviceAccountName" $root }}
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $root.Values.podSecurityContext.worker | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "papervault.image" $root.Values.image.worker | quote }}
          imagePullPolicy: {{ $root.Values.image.worker.pullPolicy }}
          command:
            - celery
            - -A
            - papervault_api.worker.celery_app:celery_app
            - worker
            - --loglevel=INFO
            - {{ printf "--concurrency=%v" (ternary ($root.Values.worker.concurrency | default 2) ($root.Values.worker.enrichmentConcurrency | default 1) (eq $role "worker")) | quote }}
            - --prefetch-multiplier=1
            {{- if $root.Values.worker.separateEnrichment }}
            - {{ ternary "--queues=celery" "--queues=papervault-enrichment" (eq $role "worker") | quote }}
            {{- else }}
            - --queues=celery,papervault-enrichment
            {{- end }}
          securityContext:
            {{- toYaml $root.Values.containerSecurityContext.worker | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "papervault.configMapName" $root }}
            - secretRef:
                name: {{ include "papervault.secretName" $root }}
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import socket
                  from papervault_api.worker.celery_app import celery_app
                  replies = celery_app.control.ping(destination=["celery@" + socket.gethostname()], timeout=3)
                  assert replies, "Worker did not answer through its configured broker"
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 15
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml (get $root.Values.resources $role | default $root.Values.resources.worker) | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}

{{- end }}
{{- end }}
