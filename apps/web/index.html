<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PaperVault</title>
    <meta
      name="description"
      content="Your private, searchable document archive."
    />
    <script>
      try {
        const saved = localStorage.getItem("papervault.theme");
        const dark =
          saved === "dark" ||
          (!saved && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
